[workspace]
name = "owe"
members = [
  "src/Core",
  "src/Audio",
  "src/Scene/types",
  "src/Scene/Utils",
  "src/Vulkan",
  "src/Scene",
  "src/Web",
  "cli/common",
  "cli/scene",
  "cli/web",
  "plugins/waywallen",
  "tests",
]
default-members = ["cli/scene", "cli/web"]

[workspace.package]
version = "0.3.4"

[workspace.dependencies]
owe-core = { path = "src/Core" }
owe-audio = { path = "src/Audio" }
owe-types = { path = "src/Scene/types" }
owe-utils = { path = "src/Scene/Utils" }
owe-vulkan = { path = "src/Vulkan" }
owe-scene = { path = "src/Scene" }
owe-web = { path = "src/Web" }
owe-cli-common = { path = "cli/common" }
owe-cli-scene = { path = "cli/scene" }
owe-cli-web = { path = "cli/web" }
rstd-std = { version = "0.1.9" }
rstd-cppstd = { version = "0.1.9" }
rstd-dlopn = { version = "0.1.9" }
rstd-json = { version = "0.1.9" }
rstd-parse = { version = "0.1.9" }
rstd-log = { version = "0.1.9" }
rstd-argparse = { version = "0.1.9" }
rstd-bench = { version = "0.1.9" }
rstd-test = { version = "0.1.9" }
licrypto = { version = "0.1.1" }
liffto = { version = "0.1.0" }
vvk = { version = "0.1.2" }
spirvto = { version = "0.1.0" }
wavsen = { git = "https://github.com/hypengw/wavsen.git" }
vrento = { git = "https://github.com/vecren/vrento.git" }
vectext = { git = "https://github.com/vecren/vectext.git" }
vui-host = { git = "https://github.com/vecren/vui.git" }

[workspace.external-dependencies.pkg-config.lz4]
module = "liblz4"

[workspace.external-dependencies.pkg-config.waywallen-bridge]
module = "waywallen-bridge"

[workspace.external-sources.eigen]
git = "https://chromium.googlesource.com/external/gitlab.com/libeigen/eigen.git"
rev = "bc3b39870ecb690a623a3f49149a358b95c5781d"

[workspace.external-dependencies.cmake.eigen]
package = "Eigen3"
source = "eigen"
cache = { BUILD_TESTING = false, EIGEN_BUILD_TESTING = false, EIGEN_BUILD_BLAS = false, EIGEN_BUILD_LAPACK = false, EIGEN_BUILD_DOC = false, EIGEN_BUILD_DEMOS = false, EIGEN_BUILD_PKGCONFIG = false, EIGEN_BUILD_CMAKE_PACKAGE = true }

[workspace.external-sources.glslang]
git = "https://github.com/KhronosGroup/glslang.git"
rev = "275822a6261ee689aadb1da5f09a0ec2f058685c"

[workspace.external-dependencies.cmake.glslang]
package = "glslang"
source = "glslang"
cache = { ENABLE_GLSLANG_BINARIES = false, ENABLE_HLSL = true, ENABLE_OPT = false, ENABLE_CTEST = false, BUILD_EXTERNAL = false, GLSLANG_TESTS = false, BUILD_TESTING = false }

[workspace.external-sources.quickjs]
git = "https://github.com/quickjs-ng/quickjs.git"
rev = "3c051980ab7e783dfbfb1c70c014ce5e05ecf24c"

[workspace.external-dependencies.cmake.quickjs]
package = "qjs"
source = "quickjs"
config-directory = "lib/cmake/quickjs"
cache = { CMAKE_INSTALL_LIBDIR = "lib", BUILD_SHARED_LIBS = false, QJS_BUILD_EXAMPLES = false, QJS_BUILD_CLI_STATIC = false, QJS_BUILD_CLI_WITH_MIMALLOC = false, QJS_BUILD_CLI_WITH_STATIC_MIMALLOC = false, QJS_ENABLE_INSTALL = true }

[workspace.external-sources.cef]
[workspace.external-sources.cef.archives.x86_64]
archive = "https://cef-builds.spotifycdn.com/cef_binary_158.0.3%2Bg8c29be2%2Bchromium-158.0.8127.18_linux64_minimal.tar.bz2"
sha256 = "2c5dfc7c1073f61f2511ab0183e835e0810d6ace7e17811ae9d375faa838fd25"

[workspace.external-sources.cef.archives.aarch64]
archive = "https://cef-builds.spotifycdn.com/cef_binary_158.0.3%2Bg8c29be2%2Bchromium-158.0.8127.18_linuxarm64_minimal.tar.bz2"
sha256 = "99b96d19bc43b74d721638444af4c9b9ce240d6f3d1a27d1d0c33794549538f3"

[workspace.external-sources.cef-macos.archives.x86_64]
archive = "https://cef-builds.spotifycdn.com/cef_binary_158.0.3%2Bg8c29be2%2Bchromium-158.0.8127.18_macosx64_minimal.tar.bz2"
sha256 = "38e5264c72ab4bdc7e3c0889faed8a30496344a7a76a81e2ad6557006d3e24d7"

[workspace.external-sources.cef-macos.archives.aarch64]
archive = "https://cef-builds.spotifycdn.com/cef_binary_158.0.3%2Bg8c29be2%2Bchromium-158.0.8127.18_macosarm64_minimal.tar.bz2"
sha256 = "eb4877f894615c0f1b806b699c74d19c476696f7716daee22811b883a9e8441f"

[workspace.external-dependencies.cmake.cef]
package = "CEF"
source = "cef"
adapter = "src/Web/cmake/CEF.cmake"

[workspace.external-dependencies.cmake.cef-macos]
package = "CEF"
source = "cef-macos"
adapter = "src/Web/cmake/CEF.cmake"
