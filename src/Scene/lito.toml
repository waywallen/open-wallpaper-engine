[usage]
public-include-directories = [
  "third_party",
  "src",
  "src/Scene",
  "src/Scene/Scene",
  "src/Scene/Particle",
  "src/Scene/Script",
  "src/Scene/VulkanRender",
]
public-definitions = [
  'WAYWALLEN_WORKSHOP_DIR="workshop"',
  'WAYWALLEN_ASSETS_DIR="assets"',
  "FT_SIZEOF_LONG=8",
]
options = [
  "-Wextra",
  "-Wno-missing-field-initializers",
  "-Wno-gnu-zero-variadic-macro-arguments",
]

[dependencies.owe-core]
workspace = true
pub = true

